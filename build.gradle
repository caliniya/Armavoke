import java.text.SimpleDateFormat

buildscript {
    ext {
        arcVersion = 'v157.1'  // https://github.com/Anuken/Arc
    }
    
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        google()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        //classpath 'com.android.tools.build:gradle:8.1.2'
        // 构建脚本需要的 Arc 模块
        classpath "com.github.Anuken.Arc:arc-core:$arcVersion"
    }
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "Armavoke"
        versionCode = 1
        version = '1.0'
    }

    repositories {
        mavenLocal()      
        maven { url "https://jitpack.io" }
        mavenCentral()
        google()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    }
    tasks.withType(JavaCompile){
        targetCompatibility = 8
        sourceCompatibility = JavaVersion.VERSION_17
        options.encoding = "UTF-8"
        options.compilerArgs += ["-Xlint:deprecation"]

        options.forkOptions.jvmArgs += [
            '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
            '--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
            '--add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED'
        ]
    }
}

configure(project(":annotation")){
    tasks.withType(JavaCompile){
        targetCompatibility = 8
        sourceCompatibility = 8
        options.fork = true
    }
}

configure(project(":tools")){
    tasks.withType(JavaCompile){
        targetCompatibility = 8
        sourceCompatibility = 8
        options.fork = true
    }
}


//工具和注解模块使用纯java8()
configure(subprojects - project(":annotation") - project(":tools")){
    tasks.withType(JavaCompile){
        options.compilerArgs.addAll(['--release', '8'])
    }

    tasks.withType(Javadoc){
        options{
            addStringOption('Xdoclint:none', '-quiet')
            addStringOption('-release', '17')
            encoding('UTF-8')
        }
    }
}


project(":desktop") {
    apply plugin: "java"

    compileJava.options.fork = true

    dependencies {
        implementation project(":core")
        
        annotationProcessor 'com.github.Anuken:jabel:0.9.0'
        
        implementation "com.github.Anuken.Arc:natives-desktop:$arcVersion"
        implementation "com.github.Anuken.Arc:natives-freetype-desktop:$arcVersion"
        implementation "com.github.Anuken.Arc:backend-sdl:$arcVersion"
    }
}

project(":base") {
    apply plugin: "java-library"
    compileJava.options.fork = true
    dependencies {
        // 纯基础数据结构模块，只依赖 Arc 核心（无平台绑定）
        api "com.github.Anuken.Arc:arc-core:$arcVersion"
    }
}

project(":annotation") {
    apply plugin: "java"
    dependencies {
        // @AnnoProc/AutoProcessor 在 base；AutoProcessor 作为本模块编译期处理器生成 SPI
        implementation project(":base")
        annotationProcessor project(":base")
        implementation 'com.squareup:javapoet:1.12.1'
        implementation "com.github.Anuken.Arc:arc-core:$arcVersion"
    }
}

project(":core") {
    apply plugin: "java-library"
    compileJava.options.fork = true
    dependencies {
        annotationProcessor 'com.github.Anuken:jabel:0.9.0'
        
        compileOnly project(":annotation")
        annotationProcessor project(":annotation")
        implementation project(":base")
        
        // 这是啥来着
        api "org.lz4:lz4-java:1.8.0"
        
        // Arc
        api "com.github.Anuken.Arc:arc-core:$arcVersion"
        api "com.github.Anuken.Arc:flabel:$arcVersion"
        api "com.github.Anuken.Arc:freetype:$arcVersion"
        api "com.github.Anuken.Arc:g3d:$arcVersion"
        api "com.github.Anuken.Arc:fx:$arcVersion"
        api "com.github.Anuken.Arc:arcnet:$arcVersion"
        api "com.github.Anuken.Arc:filedialogs:$arcVersion"
    }
}

project(":tools") {
    apply plugin: "java-library"
    
    dependencies {
        implementation "com.github.Anuken.Arc:packer:$arcVersion"
        implementation "com.github.Anuken.Arc:arc-core:$arcVersion"
    }
}